  - name: home
    label: Halaman Depan
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: heroImage
        label: Foto utama halaman depan
        type: image
        description: Foto besar di atas halaman depan.
      - name: heroAlt
        label: Deskripsi foto
        type: string
        description: Satu kalimat tentang isi foto.
      - name: whyImage
        label: Foto bagian "Kenapa Intravest"
        type: image
        description: Opsional. Foto di samping daftar keunggulan. Cocok foto guide atau tim.
      - name: whyAlt
        label: Deskripsi foto (Kenapa Intravest)
        type: string
      - name: ctaImage
        label: Foto bagian penutup (ajakan WhatsApp)
        type: image
        description: Opsional. Foto latar di bagian paling bawah halaman depan.
      - name: ctaAlt
        label: Deskripsi foto (penutup)
        type: string
  - name: about
    label: Halaman Tentang Kami
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: heroImage
        label: Foto lebar di bagian atas
        type: image
        description: Opsional. Foto suasana trip yang tenang. Kosong = tidak ditampilkan.
      - name: heroAlt
        label: Deskripsi foto (atas)
        type: string
      - name: storyImage
        label: Foto bagian cerita kami
        type: image
        description: Opsional. Foto tim atau guide lokal saat bekerja.
      - name: storyAlt
        label: Deskripsi foto (cerita)
        type: string
      - name: place1
        label: Foto tempat operasi 1
        type: image
        description: Opsional. Satu foto per destinasi.
      - name: place1Alt
        label: Deskripsi foto tempat 1
        type: string
      - name: place2
        label: Foto tempat operasi 2
        type: image
      - name: place2Alt
        label: Deskripsi foto tempat 2
        type: string
      - name: place3
        label: Foto tempat operasi 3
        type: image
      - name: place3Alt
        label: Deskripsi foto tempat 3
        type: string
      - name: place4
        label: Foto tempat operasi 4
        type: image
      - name: place4Alt
        label: Deskripsi foto tempat 4
        type: string
  - name: pengaturan
    label: Pengaturan Situs
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: company
        label: Perusahaan
        type: object
        fields:
          - name: name
            label: Nama merek
            type: string
            description: Tampil di logo, footer, dan judul halaman.
          - name: fullName
            label: Nama lengkap
            type: string
          - name: tagline
            label: Tagline
            type: string
            description: Tampil di footer.
          - name: logo
            label: Logo
            type: image
            description: "Nama file di galeri Foto (PNG atau SVG, latar transparan, minimal 200 px tinggi). Kosong = logo daun bawaan."
          - name: favicon
            label: Favicon (ikon tab browser)
            type: image
            description: "Gambar persegi, minimal 256x256 px (PNG atau SVG). Kosong = ikon bawaan."
          - name: address
            label: Alamat kantor (opsional)
            type: text
            description: Tampil di footer dan halaman Kontak. Kosong = tidak ditampilkan.
          - name: descriptionEn
            label: Deskripsi singkat (EN)
            type: text
            description: Dipakai di Google dan saat tautan dibagikan, kalau halaman tidak punya deskripsi sendiri.
          - name: descriptionId
            label: Deskripsi singkat (ID)
            type: text
      - name: contact
        label: Kontak
        type: object
        description: Kosongkan untuk memakai nilai bawaan dari Netlify.
        fields:
          - name: whatsapp
            label: Nomor WhatsApp
            type: string
            description: "Dengan kode negara, tanpa tanda plus atau spasi. Contoh: 6281234567890"
          - name: whatsappDisplay
            label: Nomor WhatsApp (tampilan)
            type: string
            description: "Cara nomor ditulis di footer dan halaman Kontak. Contoh: +62 812-3456-7890"
          - name: email
            label: Email
            type: string
      - name: social
        label: Media sosial
        type: object
        description: Alamat lengkap profil (https://...). Yang kosong disembunyikan dari footer.
        fields:
          - name: instagram
            label: Instagram
            type: string
          - name: tiktok
            label: TikTok
            type: string
          - name: threads
            label: Threads
            type: string
