              maxlength: 160
          - name: priceNote
            label: Catatan harga
            type: string
          - name: itinerary
            label: Itinerary
            type: object
            list: true
            description: Satu entri per hari. Jumlahnya harus sama dengan "Jumlah hari".
            fields:
              - name: title
                label: Judul hari
                type: string
              - name: plan
                label: Rencana hari ini
                type: string
                list: true
                description: Satu baris per kegiatan
              - name: meals
