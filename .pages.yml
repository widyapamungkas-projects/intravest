            type: string
          - name: itinerary
            label: Itinerary
            type: object
            list: true
            description: Satu entri per hari. Jumlahnya harus sama dengan "Jumlah hari".
            fields:
              - name: title
                label: Judul hari
                type: string
              - name: plan
                label: Rencana hari ini
                type: string
