          - name: srcDigest
            label: Penanda terjemahan (otomatis)
            type: string
            description: Diisi otomatis. Jangan diubah.
  - name: stories-en
    label: Travel Stories (EN)
    type: collection
    path: src/content/stories/en
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - category
        - date
      sort:
        - date
      order: desc
    fields:
      - name: title
        label: Judul
        type: string
        required: true
      - name: description
        label: Deskripsi SEO
        type: text
        required: true
        description: Maksimal 160 karakter. Tampil di Google dan kartu artikel.
        options:
          maxlength: 160
      - name: date
        label: Tanggal terbit
        type: date
        required: true
      - name: category
        label: Kategori
        type: select
        required: true
        options:
          values:
            - value: bali
              label: Bali
            - value: lombok
              label: Lombok
            - value: labuan-bajo
              label: Labuan Bajo
            - value: yogyakarta
              label: Yogyakarta
            - value: surabaya
              label: Surabaya
            - value: jakarta-bandung
              label: Jakarta-Bandung
            - value: tips
              label: Tips & Panduan
      - name: tags
        label: Tag
        type: string
        list: true
      - name: ogImage
        label: Gambar share (opsional)
        type: string
        description: Path gambar, mis. /og/default.jpg. Biarkan kosong kalau belum ada.
      - name: image
        label: Foto utama
        type: image
        description: Unggah atau pilih foto. Ukuran asli tidak apa-apa, situs mengecilkannya otomatis. Kosongkan kalau belum ada.
      - name: imageAlt
        label: Deskripsi foto
        type: string
        description: Satu kalimat tentang isi foto (untuk pembaca layar dan Google). Wajib diisi kalau ada foto.
      - name: postToThreads
        label: Posting ke Threads saat terbit
        type: boolean
        default: false
        description: Nyalakan untuk memposting artikel ini ke akun Threads sekali, otomatis, setelah situs selesai diperbarui.
      - name: threadsText
        label: Teks posting Threads (opsional)
        type: text
        description: Maksimal 450 karakter. Kosong = judul dan deskripsi artikel. Tautan artikel ditambahkan otomatis.
        options:
          maxlength: 450
      - name: threadsPostedAt
        label: Sudah diposting ke Threads (otomatis)
        type: string
        description: Diisi otomatis setelah posting. Kosongkan hanya kalau mau memposting ulang.
      - name: body
        label: Body
        type: rich-text
