            label: Nama paket
            type: string
          - name: summary
            label: Ringkasan
            type: text
            description: Maksimal 160 karakter. Tampil di kartu paket dan Google.
            options:
              maxlength: 160
          - name: priceNote
            label: Catatan harga
            type: string
          - name: itinerary
            label: Itinerary
            type: object
            list: true
            description: Satu entri per hari. Jumlahnya harus sama dengan "Jumlah hari".
            fields:
              - name: title
                label: Judul hari
                type: string
              - name: plan
                label: Rencana hari ini
                type: string
                list: true
                description: Satu baris per kegiatan
              - name: meals
                label: Makan
                type: string
              - name: stay
                label: Menginap
                type: string
          - name: inclusions
            label: Sudah termasuk
            type: string
            list: true
          - name: exclusions
            label: Belum termasuk
            type: string
            list: true
          - name: imageAlt
            label: Deskripsi foto
            type: string
            description: Satu kalimat tentang isi foto (untuk pembaca layar dan Google).
          - name: body
            label: Isi
            type: rich-text
          - name: needsReview
            label: Terjemahan otomatis, perlu dicek
            type: boolean
            default: false
            description: Dinyalakan otomatis oleh terjemah AI. Matikan setelah kamu cek, supaya tidak ditimpa lagi.
          - name: srcDigest
            label: Penanda terjemahan (otomatis)
            type: string
            description: Diisi otomatis. Jangan diubah.
      - name: id
        label: Teks Indonesia (ID)
        type: object
        description: Isi satu bahasa saja untuk terjemahan otomatis (kosongkan Nama/Judul di bahasa lainnya).
        fields:
          - name: title
            label: Nama paket
