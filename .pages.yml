# Konfigurasi dashboard Pages CMS (https://pagescms.org).
# Field di sini harus sama dengan schema di src/content.config.ts. Kalau schema berubah, ubah file ini juga.
# Destinasi dan Paket Wisata: satu file per item berisi data umum + teks EN + teks ID (lihat src/loaders/bilingual.ts).
settings:
  hide: true
media:
  - name: images
    label: Foto
    input: src/assets/images
    output: /src/assets/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
content:
  - name: destinations
    label: Destinasi
    type: collection
    path: src/content/destinations
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: slug
      fields:
        - slug
        - order
      sort:
        - order
      order: asc
    fields:
      - name: slug
        label: Alamat (slug)
        type: string
        required: true
        description: "Huruf kecil dan tanda hubung, contoh: labuan-bajo. Jadi alamat halaman dan tidak bisa diganti setelah dibuat."
      - name: order
        label: Urutan tampil
        type: number
        required: true
        options:
          min: 1
      - name: image
        label: Foto utama
        type: image
        description: Satu foto untuk EN dan ID. Unggah atau pilih foto. Ukuran asli tidak apa-apa.
      - name: en
        label: Teks Inggris (EN)
        type: object
        description: Isi satu bahasa saja untuk terjemahan otomatis (kosongkan Nama/Judul di bahasa lainnya).
        fields:
          - name: title
            label: Nama destinasi
            type: string
          - name: tagline
            label: Tagline
            type: string
          - name: description
            label: Deskripsi SEO
            type: text
            description: Maksimal 160 karakter. Tampil di hasil Google.
            options:
              maxlength: 160
          - name: see
            label: Something to See
            type: string
            list: true
            description: Satu baris per tempat
          - name: activities
            label: Something to Do
            type: string
            list: true
          - name: shopping
            label: Something to Buy
            type: string
            list: true
          - name: imageAlt
            label: Deskripsi foto
            type: string
            description: Satu kalimat tentang isi foto (untuk pembaca layar dan Google).
          - name: body
            label: Isi
            type: rich-text
          - name: needsReview
            label: Terjemahan otomatis, perlu dicek
            type: boolean
            default: false
            description: Dinyalakan otomatis oleh terjemah AI. Matikan setelah kamu cek, supaya tidak ditimpa lagi.
          - name: srcDigest
            label: Penanda terjemahan (otomatis)
            type: string
            description: Diisi otomatis. Jangan diubah.
      - name: id
        label: Teks Indonesia (ID)
        type: object
        description: Isi satu bahasa saja untuk terjemahan otomatis (kosongkan Nama/Judul di bahasa lainnya).
        fields:
          - name: title
            label: Nama destinasi
            type: string
          - name: tagline
            label: Tagline
            type: string
          - name: description
            label: Deskripsi SEO
            type: text
            description: Maksimal 160 karakter. Tampil di hasil Google.
            options:
              maxlength: 160
          - name: see
            label: Something to See
            type: string
            list: true
            description: Satu baris per tempat
          - name: activities
            label: Something to Do
            type: string
            list: true
          - name: shopping
            label: Something to Buy
            type: string
            list: true
          - name: imageAlt
            label: Deskripsi foto
            type: string
            description: Satu kalimat tentang isi foto (untuk pembaca layar dan Google).
          - name: body
            label: Isi
            type: rich-text
          - name: needsReview
            label: Terjemahan otomatis, perlu dicek
            type: boolean
            default: false
            description: Dinyalakan otomatis oleh terjemah AI. Matikan setelah kamu cek, supaya tidak ditimpa lagi.
          - name: srcDigest
            label: Penanda terjemahan (otomatis)
            type: string
            description: Diisi otomatis. Jangan diubah.
  - name: tours
    label: Paket Wisata
    type: collection
    path: src/content/tours
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: slug
      fields:
        - code
        - slug
        - priceIDR
        - priceIsDraft
      sort:
        - order
      order: asc
    fields:
      - name: slug
        label: Alamat (slug)
        type: string
        required: true
        description: "Huruf kecil dan tanda hubung, contoh: bali-essentials. Jadi alamat halaman dan tidak bisa diganti setelah dibuat."
      - name: code
        label: Kode paket
        type: string
        required: true
        description: "Contoh: BAL-01"
      - name: destination
        label: Destinasi
        type: select
        required: true
        options:
          values:
            - value: bali
              label: Bali
            - value: lombok
              label: Lombok
            - value: labuan-bajo
              label: Labuan Bajo
            - value: yogyakarta
              label: Yogyakarta
            - value: surabaya
              label: Surabaya
            - value: jakarta-bandung
              label: Jakarta-Bandung
      - name: days
        label: Jumlah hari
        type: number
        required: true
        options:
          min: 1
      - name: nights
        label: Jumlah malam
        type: number
        required: true
        options:
          min: 0
      - name: order
        label: Urutan tampil
        type: number
        required: true
        options:
          min: 1
      - name: priceIDR
        label: Harga per orang (Rp)
        type: number
        required: true
        description: "Angka saja, tanpa titik. Contoh: 4900000"
        options:
          min: 1
      - name: priceIsDraft
        label: Harga masih draf?
        type: boolean
        default: true
        description: Matikan setelah harga final disetujui
      - name: minPax
        label: "Dasar harga: jumlah peserta"
        type: number
        default: 2
        options:
          min: 1
      - name: image
        label: Foto utama
        type: image
        description: Satu foto untuk EN dan ID. Unggah atau pilih foto. Ukuran asli tidak apa-apa.
      - name: en
        label: Teks Inggris (EN)
        type: object
        description: Isi satu bahasa saja untuk terjemahan otomatis (kosongkan Nama/Judul di bahasa lainnya).
