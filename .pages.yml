      - name: days
        label: Jumlah hari
        type: number
        required: true
        options:
          min: 1
      - name: nights
        label: Jumlah malam
        type: number
        required: true
        options:
          min: 0
      - name: order
        label: Urutan tampil
        type: number
        required: true
        options:
          min: 1
      - name: priceIDR
        label: Harga per orang (Rp)
        type: number
        required: true
        description: "Angka saja, tanpa titik. Contoh: 4900000"
        options:
          min: 1
      - name: priceIsDraft
        label: Harga masih draf?
        type: boolean
        default: true
        description: Matikan setelah harga final disetujui
      - name: minPax
        label: "Dasar harga: jumlah peserta"
        type: number
        default: 2
        options:
          min: 1
      - name: image
        label: Foto utama
        type: image
        description: Satu foto untuk EN dan ID. Unggah atau pilih foto. Ukuran asli tidak apa-apa.
      - name: en
