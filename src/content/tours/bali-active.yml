en:
  title: Bali Active
  summary: Four days of sunrise trekking, river rafting, and waterfalls around Ubud, with a rest block after each big activity.
  priceNote: Per person, based on 2 travelers sharing a room.
  itinerary:
    - title: Arrival, waterfall, and rice terraces
      plan:
        - Airport pickup by your driver and guide
        - Waterfall stop in central Bali
        - Tegalalang rice terraces
        - Check in at your Ubud hotel
      meals: Lunch and dinner
      stay: Ubud
    - title: Mount Batur sunrise trek
      plan:
        - Early pickup for the Mount Batur sunrise trek with a trek guide
        - Breakfast at the summit area, then the walk down
        - Back at the hotel by late morning to rest
        - Tirta Empul holy spring temple in the late afternoon
      meals: Breakfast and dinner
      stay: Ubud
    - title: Ayung River rafting
      plan:
        - Morning rafting on the Ayung River, about 2 hours on the water
        - Lunch after rafting
        - Free afternoon in Ubud
      meals: Breakfast and lunch
      stay: Ubud
    - title: Craft villages and departure
      plan:
        - Silverwork in Celuk and wood carving in Mas
        - Transfer to the airport, timed to your flight
      meals: Breakfast
  inclusions:
    - 3 nights in a boutique hotel in the Ubud area, twin or double room
    - Private air-conditioned car with driver for the whole itinerary
    - Local guide on Day 1 to Day 3
    - Mount Batur trek with a licensed trek guide
    - Ayung River rafting, including equipment and shower facilities
    - Airport transfers
    - Entrance tickets and donations for the places listed
    - Meals as marked in the itinerary, at selected restaurants
    - Bottled water in the car
  exclusions:
    - International and domestic flights
    - Travel insurance
    - Personal expenses and tips
    - Activities not listed in the itinerary
    - Meals not marked in the itinerary
  body: |-
    For people who want to do things, not only look at them. The two big activities, the Batur trek and the rafting, sit on different days, and the afternoon after the trek is kept free on purpose.

    The Batur trek starts around 3 AM and is a moderate walk in the dark. Rafting suits most fitness levels. Tell us about anyone in the group with knee or back issues and we will adjust.
  needsReview: false
id:
  title: Bali Active
  summary: Empat hari trekking sunrise, rafting, dan air terjun di sekitar Ubud, dengan waktu istirahat setelah tiap aktivitas besar.
  priceNote: Per orang, dengan asumsi 2 peserta sekamar.
  itinerary:
    - title: Tiba, air terjun, dan sawah terasering
      plan:
        - Dijemput driver dan guide di bandara
        - Singgah di air terjun Bali tengah
        - Sawah terasering Tegalalang
        - Check-in di hotel area Ubud
      meals: Makan siang dan makan malam
      stay: Ubud
    - title: Trekking sunrise Gunung Batur
      plan:
        - Dijemput dini hari untuk trekking sunrise Gunung Batur bersama trek guide
        - Sarapan di area puncak, lalu turun
        - Kembali ke hotel menjelang siang untuk istirahat
        - Pura mata air suci Tirta Empul di sore hari
      meals: Sarapan dan makan malam
      stay: Ubud
    - title: Rafting Sungai Ayung
      plan:
        - Rafting pagi di Sungai Ayung, sekitar 2 jam di atas air
        - Makan siang setelah rafting
        - Sore bebas di Ubud
      meals: Sarapan dan makan siang
      stay: Ubud
    - title: Desa kerajinan dan pulang
      plan:
        - Kerajinan perak di Celuk dan ukiran kayu di Mas
        - Antar ke bandara, disesuaikan dengan jam penerbangan
      meals: Sarapan
  inclusions:
    - 3 malam di hotel butik area Ubud, kamar twin atau double
    - Mobil pribadi ber-AC dengan driver selama itinerary
    - Guide lokal di Hari 1 sampai Hari 3
    - Trekking Gunung Batur dengan trek guide berlisensi
    - Rafting Sungai Ayung, termasuk peralatan dan fasilitas bilas
    - Antar-jemput bandara
    - Tiket masuk dan donasi untuk tempat yang tercantum
    - Makan sesuai tanda di itinerary, di restoran pilihan kami
    - Air mineral di mobil
  exclusions:
    - Tiket pesawat internasional dan domestik
    - Asuransi perjalanan
    - Pengeluaran pribadi dan tip
    - Aktivitas yang tidak tercantum di itinerary
    - Makan yang tidak ditandai di itinerary
  body: |-
    Untuk yang mau melakukan sesuatu, bukan cuma melihat. Dua aktivitas besarnya, trekking Batur dan rafting, ada di hari yang berbeda, dan sore setelah trekking sengaja dikosongkan.

    Trekking Batur mulai sekitar jam 3 pagi dan jalurnya tergolong sedang, jalan dalam gelap. Rafting cocok untuk kebanyakan tingkat kebugaran. Kalau ada peserta dengan keluhan lutut atau punggung, kabari kami dan kami sesuaikan.
  needsReview: false
