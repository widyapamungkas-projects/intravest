slug: yogyakarta
order: 4
image: /src/assets/images/borobudur-stupas-in-golden-light-compressed.jpg
en:
  title: Central Of Java
  tagline: Temples, craft villages, and Javanese food worth planning a day around.
  description: "Yogyakarta trips with a local guide: Borobudur and Prambanan, the
    Sultan's palace, craft villages, and Javanese food, at a pace that works."
  see:
    - Borobudur and Prambanan temples
    - The Kraton, the Sultan's palace
    - Taman Sari water castle
    - Kotagede, the old silver-working quarter
  activities:
    - Sunrise viewpoint near Borobudur
    - A batik workshop
    - A Mount Merapi jeep tour
    - Cycling through village rice fields
    - A Javanese cooking class
  shopping:
    - Hand-drawn batik
    - Kotagede silverwork
    - Leather wayang puppets
    - Bakpia and other local snacks
  imageAlt: Borobudur Temple
  body: >-
    Yogyakarta is compact, which helps. The big temples are most comfortable at
    the start or end of the day, when it is cooler and quieter, so we sequence
    them around calmer city stops.


    Food is a reason to come here, not a side note, so meals are planned too.
  needsReview: false
id:
  title: Jogja Bagian Tengah
  tagline: Candi, desa kerajinan, dan kuliner Jawa yang layak disisihkan satu hari.
  description: "Trip Yogyakarta dengan guide lokal: Borobudur dan Prambanan,
    keraton, desa kerajinan, dan kuliner Jawa, dengan ritme yang nyaman."
  see:
    - Candi Borobudur dan Prambanan
    - Keraton Yogyakarta
    - Taman Sari
    - Kotagede, kawasan lama pengrajin perak
  activities:
    - Sunrise di sekitar Borobudur
    - Workshop batik
    - Tur jeep Gunung Merapi
    - Bersepeda melewati sawah dan desa
    - Kelas masak masakan Jawa
  shopping:
    - Batik tulis
    - Kerajinan perak Kotagede
    - Wayang kulit
    - Bakpia dan oleh-oleh khas
  body: >-
    Yogyakarta ringkas, dan itu menguntungkan. Candi-candi besar paling nyaman
    dikunjungi di awal atau akhir hari, saat lebih sejuk dan sepi, jadi kami
    susun urutannya di sekitar tempat-tempat kota yang lebih tenang.


    Makanan adalah alasan datang ke sini, bukan pelengkap, jadi jadwal makannya
    juga kami rencanakan.
  needsReview: false
