en:
  title: Bali
  tagline: Culture, nature, and activities that fill each day without rushing it.
  description: "Bali trips with a local guide: Ubud's rice terraces, waterfalls, volcano sunrise, and craft villages, planned with realistic timing for each day."
  see:
    - Tegalalang rice terraces, best early in the morning
    - Tirta Empul, the holy spring temple near Tampaksiring
    - Uluwatu cliffs and temple at sunset
    - The Mount Batur crater view from Kintamani
  activities:
    - Mount Batur sunrise trek
    - Rafting on the Ayung River
    - A Balinese cooking class with a market visit
    - Waterfall stops in central Bali
    - A snorkeling day trip to Nusa Penida or Nusa Lembongan
  shopping:
    - Silverwork in Celuk
    - Wood carving in Mas
    - Handwoven ikat and batik textiles
    - Balinese coffee and cacao
  imageAlt: Barong Dance
  body: |-
    Bali is small, but traffic is slow. A day that looks short on the map can take twice as long on the road, so we plan each day around one main area and one main activity.

    That is how a trip can include a sunrise trek, a quiet morning in Ubud, and time for a proper meal, without any day feeling like a checklist.
  needsReview: false
id:
  title: Bali
  tagline: Budaya, alam, dan aktivitas yang mengisi tiap hari tanpa terburu-buru.
  description: "Trip Bali dengan guide lokal: sawah terasering Ubud, air terjun, sunrise gunung, dan desa kerajinan, dengan jadwal yang realistis tiap harinya."
  see:
    - Sawah terasering Tegalalang, paling nyaman pagi hari
    - Tirta Empul, pura mata air suci dekat Tampaksiring
    - Tebing dan pura Uluwatu saat sunset
    - Pemandangan kaldera Gunung Batur dari Kintamani
  activities:
    - Trekking sunrise Gunung Batur
    - Rafting di Sungai Ayung
    - Kelas masak Bali dengan kunjungan ke pasar
    - Singgah di air terjun Bali tengah
    - Snorkeling sehari ke Nusa Penida atau Nusa Lembongan
  shopping:
    - Kerajinan perak di Celuk
    - Ukiran kayu di Mas
    - Kain tenun ikat dan batik
    - Kopi dan cokelat Bali
  body: |-
    Bali memang kecil, tapi lalu lintasnya pelan. Hari yang tampak singkat di peta bisa memakan waktu dua kali lipat di jalan, jadi kami susun tiap hari di sekitar satu area utama dan satu aktivitas utama.

    Dengan begitu, satu trip bisa berisi trekking sunrise, pagi yang tenang di Ubud, dan waktu untuk makan dengan layak, tanpa ada hari yang terasa seperti daftar centang.
  needsReview: false
