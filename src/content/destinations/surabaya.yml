en:
  title: Eastern Java
  tagline: A heritage city and the gateway to Mount Bromo.
  description: "Surabaya trips with a local guide: old-town heritage, East Java
    food, and an overnight Mount Bromo sunrise trip, with transfers handled for
    you."
  see:
    - House of Sampoerna museum
    - Heroes Monument and museum
    - Kota Lama and Jembatan Merah
    - Ampel Mosque and the Arab quarter
  activities:
    - Mount Bromo sunrise trip, with a night near the park
    - "A Surabaya food walk: rawon, rujak cingur, lontong balap"
    - A heritage walk through the old town
  shopping:
    - Madura batik
    - Dates, spices, and snacks around Ampel
  body: >-
    Surabaya is a city to eat in and get to know, and a base for Mount Bromo, a
    few hours away by road. We suggest staying near the park the night before,
    so the sunrise start is not preceded by a long drive.


    We plan East Javanese meals as part of the itinerary, not as filler between
    sights.
  needsReview: false
id:
  title: Jawa Bagian Timur
  tagline: Kota bersejarah sekaligus pintu masuk ke Gunung Bromo.
  description: "Trip Surabaya dengan guide lokal: kota tua, kuliner Jawa Timur,
    dan sunrise Gunung Bromo dengan menginap, lengkap dengan transfer yang kami
    atur."
  see:
    - Museum House of Sampoerna
    - Tugu Pahlawan dan museumnya
    - Kota Lama dan Jembatan Merah
    - Masjid Ampel dan kawasan Arab
  activities:
    - Trip sunrise Gunung Bromo, menginap dekat kawasan taman nasional
    - "Jalan kuliner Surabaya: rawon, rujak cingur, lontong balap"
    - Jalan kaki menyusuri kota tua
  shopping:
    - Batik Madura
    - Kurma, rempah, dan camilan di sekitar Ampel
  body: >-
    Surabaya cocok untuk makan dan mengenal kotanya, sekaligus basis menuju
    Gunung Bromo yang berjarak beberapa jam lewat darat. Kami sarankan menginap
    dekat kawasan taman nasional malam sebelumnya, supaya start sunrise tidak
    didahului perjalanan panjang.


    Kami masukkan makan khas Jawa Timur sebagai bagian dari itinerary, bukan
    pengisi waktu di antara tempat wisata.
  needsReview: false
