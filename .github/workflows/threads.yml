# Posts a Travel Story to Threads once when its dashboard toggle "Posting ke Threads saat terbit" is on
# (see scripts/post-threads.mjs). Runs when a story file changes on main, and by hand.
# Needs repository secrets THREADS_USER_ID and THREADS_ACCESS_TOKEN, and a variable or secret SITE_URL.
# Without them it does nothing.
name: Post to Threads
on:
  push:
    branches: [main]
    paths:
      - 'src/content/stories/**'
  workflow_dispatch:
concurrency:
  group: threads
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post pending stories
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/post-threads.mjs
      - name: Save "already posted" marker
        if: always()
        run: |
          if [ -n "$(git status --porcelain src/content/stories)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/stories
            git commit -m "Mark story as posted to Threads [skip ci]"
            git pull --rebase origin main
            git push
          fi
