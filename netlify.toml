[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node >= 22.23.4 (see engines in node_modules/astro/package.json)
  NODE_VERSION = "22"

# --- Default language -------------------------------------------------------
# Step 11 in the project brief defines English as the default root language.
# "/" always redirects to /en/. Existing /id/... and /en/... URLs are preserved.
# force = true is required because src/pages/index.astro also builds a fallback route.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# --- Headers ----------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build output never changes, so it can be cached for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
